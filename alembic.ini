# Az Alembic konfiguráció (a 01 – stack-terv §3.2: az Alembic a
# migrációs eszköz; a `db/migrations/` a séma FORRÁSA, a `db/ddl/` a
# generált olvasható másolat — a 01 §4.3).
#
# **A `script_location` a `db/migrations/`** → a `just db-migrate`
# (az `alembic upgrade head`) innen olvassa a migrációkat.
#
# **Az URL-t a `duna.config` adja** (a pydantic-settings, a `.env`-ből)
# -> **a `script_location` alatt nincs `sqlalchemy.url`** -> az
# `env.py` felülírja.

[alembic]
script_location = db/migrations
prepend_sys_path = apps/api/src
version_path_separator = os
# A fájlnevek timestamp-prefixet kapnak (a 01 §3.2: a "számozott,
# visszafordítható" migrációk)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
