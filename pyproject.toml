[project]
name = "vessel-tracker"
version = "0.1.0"
description = "Hajókövető a Dunán és a Balatonon — a vessel-tracker R1"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# A runtime függőségek (a 01 – stack-terv §3 alapján)
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.17",   # a tömeges import (a F-ADM-07)
    "orjson>=3.10",                # a gyors JSON (a F-NF-01)
]

[project.optional-dependencies]
# A fejlesztői eszközök (a 07 §3.1 `just setup` -> `uv sync`)
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-rerunfailures>=15.0",   # az integrációs/e2e retry (a 07 §8.1)
    "hypothesis>=6.112",            # a property tesztek (a 08 §2.1)
    "testcontainers[postgres]>=4.9", # az integrációs tesztek DB-vel
    "locust>=2.32",                 # a teljesítményteszt (a F-NF-01)
    "ruff>=0.8",
    "mypy>=1.13",
    # A DDL-validátor (a db/tools/validate_ddl.py) egy sajat, hordozható
    # PostgreSQL példányt indít -> a `pgserver` a PostgreSQL binariákkal
    # együtt érkezik (a `find_psql()` a venv-ben keresi).
    "pgserver>=0.1.4",
]

[dependency-groups]
# A 07 §8.1 pipeline-lépések: a pytest markerek (a `slow`, a `integration`)
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/duna"]

# =====================================================================
# A PYTEST
# =====================================================================

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
markers = [
    "slow: a lassu tesztek (a teljesitmény, az e2e)",
    "integration: az integracios tesztek (a testcontainers DB-vel)",
    "e2e: a böngeszos (playwright) tesztek",
    "regression: az adat-regresszio (a 08 §7)",
    "reversible: a migracio-visszafordithatosag (a 07 §8.1 8. lepese)",
]
filterwarnings = ["error::DeprecationWarning"]

# =====================================================================
# A COVERAGE (a 08 §8.1: 85%, a domain/ es az ingest/ 90%)
# =====================================================================

[tool.coverage.run]
source = ["duna"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.report.exclude_also]
# A 08 §8.1: a domain/ es az ingest/ 90%
# (a `just test` a `--cov-fail-under` flaggel felulirhatja a teljes
# 85%-ot; a ket kiemelt modulon a `pyproject.toml` a szigorubb hatart)
# → a CI a ket kulcsmodulra kulon ellenorzi:
#   pytest --cov=duna.domain --cov-fail-under=90
#   pytest --cov=duna.ingest --cov-fail-under=90

# =====================================================================
# A RUFF (a lint)
# =====================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests", "db/tools", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # a hosszu sorok a docstringekben
    "RUF001",  # a magyar ekezetes karakterek (a hibaeszenetekben)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/*" = ["S101"]  # az assert a tesztekben

# =====================================================================
# A MYPY (a tipusellenorzes)
# =====================================================================

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/api/src"
packages = ["duna"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
