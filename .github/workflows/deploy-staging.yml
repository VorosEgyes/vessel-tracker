# A staging deploy (a 07 – CI/CD-terv §4.1, §6.1)
#
# A `ci.yml` sikeres UTAN a main-en (a `workflow_run` trigger) ->
# a staging deploy. A production deploy a `deploy-production.yml`
# (a manuális, jóváhagyott release).
name: Deploy staging

on:
  # **A `workflow_run` triggerrel a `branches` NEM hasznalhato** (a GitHub
  # elutasitja: "branches is not supported for workflow_run") -> **a
  # branch-szures a job `if` feltetele** (alabb).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    # A CI eredmenye kell (a workflow_run trigger a CI statuszt hozza,
    # de a job a sajat allapotaban ellenorzi)
    # A CI sikeres legyen, ES a main branchen (a `branches` a
    # `workflow_run`-nal nem szukitheto -> itt)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: pnpm}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.5"}
      - uses: extractions/setup-just@v1

      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --extra dev

      # A deploy a VPS-re SSH-vel (a 07 §7.1: a DEPLOY_SSH_KEY secret)
      - name: a deploy a staging VPS-re
        env:
          DEPLOY_HOST: ${{ vars.STAGING_HOST }}
          DEPLOY_USER: ${{ vars.STAGING_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # a kulcs a runner idejere kerul (a 0600 a kovetelmeny)
          install -m 600 /dev/null ~/.ssh/deploy_key
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          # a host kulcs ellenorzes: a known_hosts-bol, ne a StrictHostKeyChecking=no
          # (a 07 §7.1: a host azonositasa kovetelmeny)
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # a deploy script maga telepiti a migraciot, a crontabatot
          # (a 07 §6.1a) es a smoke tesztet (a 07 §9)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/duna && IMAGE_TAG=${IMAGE_TAG} ./infra/deploy.sh staging"
          rm -f ~/.ssh/deploy_key
