# A CI — a minőségi kapu (a 07 – CI/CD-terv §4.2)
#
# Minden pushra fut (a main-re és a PR-ekre). A 13 kötelező lépés
# a 07 §8.1 szerint — a gyorsak (1–10c) minden pushra, a lassuak
# (11–13) hetente (a release-branch-en).
name: CI

on:
  push:
    branches: [main, "release/*"]
  pull_request:
  workflow_dispatch:

# A szalagban csak egy fut egyszerre (a 07 §4.2)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================================
  # 1–2. a lint es a tipusellenorzes (a 07 §8.1 1–2. lepese)
  # ==================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5"
          # A Python 3.12 (a pyproject.toml: requires-python >=3.12;
          # a pgserver is csak cp312 wheel)
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # **A `cache: pnpm` NEM hasznalhato itt**: a `setup-node` a
          # pnpm-et keresi a cache beallitasakor -> a `pnpm/action-setup`
          # elott ez elbukik ("Unable to locate executable file: pnpm",
          # a 2026-11-24-i CI-futas). A frontend meg nincs a repoban ->
          # a cache nem kell.
          # (a pnpm cache a `pnpm/action-setup` utan allithato be)
      # **A `pnpm`-t a `setup-node` NEM telepiti** -> kell a
      # `pnpm/action-setup` (a 2026-11-24-i CI-futas hiba: "Unable to
      # locate executable file: pnpm")
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      # A `just` NINCS elore telepitve a GitHub Actions-en -> a
      # kanonikus parancsokhoz telepiteni kell (a 07 §4.2)
      - uses: extractions/setup-just@v1
      # **A venv ELKELL a lint jobnak is** -> a `just lint` a
      # `uv run ruff`-et hívja -> a `ruff` a dev-fuggosegek kozott van
      # -> **a `uv sync` KELL** (a 2026-11-24-i CI-futas hiba:
      # "error: Failed to spawn: `ruff`")
      - run: uv sync --frozen --extra dev
      # A pnpm-lock.yaml meg nincs a repoban (a frontend resze) ->
      # a `--frozen-lockfile` a CI-ban elbukna -> a `just` recept
      # maga ellenorzi (a 07 §3.1)
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else echo "a frontend meg nincs a repoban -> a pnpm install kihagyva"; fi
      - run: just lint
      - run: just lint-frontend
      - run: just typecheck

  # ==================================================================
  # 3–10c. a tesztek es a schema-ellenorzes (a 07 §8.1)
  # ==================================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/baosystems/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: duna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/duna_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5"
          # **A Python 3.12 KELL**: a `pgserver` 0.1.4 csak `cp312`
          # wheel-t ad (a GitHub runner default 3.14-es -> a
          # `uv sync` elbukik: "can't be installed because it doesn't
          # have a source distribution or wheel for the current
          # platform")
          python-version: "3.12"
      - uses: extractions/setup-just@v1
      # A `--extra dev` kell: a pgserver (a DDL-validacio), the pytest,
      # a ruff, a mypy -> a `just ddl-validate` a venv-bol indul
      - run: uv sync --frozen --extra dev

      # A 10c. lepes: a hajotipus-nev lista ellenorzese
      # (a report_vessels.sh CASE listaja egyezik a 02-es DDL-terv
      # seedjebel -> a riport es a DB mindig egyezik)
      - run: just check-type-case

      # A 8. lepes: a migracio-visszafordithatosag
      - run: just db-migrate
      - run: just test-reversible

      # **Az alkalmazasreteg integracios tesztjei** (a 08 §2.1a) ->
      # **a `DATABASE_URL` a fenti PostgreSQL service-re mutat** ->
      # **a `just db-migrate` MINT letrehozta a semat** ->
      # **a `just test-integration` a valodi DB-n fut** ->
      # **a 70%-os alkalmazasreteg-kapu a CI-ben ervenyes**
      - run: just test-integration

      # **A MODELLEK ELLENORZESE** (a 03 §5.1a) -> **a `db/models.py`
      # a `02` DDL ORM-reprezentacioja** -> **a kezi modellek
      # elcsuszasat a CI elkapja** (pl. a `country.name` vs. a
      # `name_local`, az `operator.legal_name`) -> **a DB-bol olvasunk**
      - run: just models-check

      # A 3–6. lepes: a 4 gyors tesztszint (a coverage flaggel)
      - run: just test

      # Az 5b. lepes: a domain 90%-os kuszobe (a 08 §8.1)
      - run: just test-domain

      # Az 5c. lepes: az ingest 90%-os kuszobe (a 08 §8.1) — az AIS
      # parser (a 04) a legbitebb kód
      - run: just test-ingest

      # A 7. lepes: a DDL-validacio (a sajat PostgreSQL-en,
      # a funkcionalis fustteszttel)
      - run: just ddl-validate

      # A 10b. lepes: a schema-drift ellenorzese (a 02 §11)
      # **A `just ddl-diff` a `--check`-et futtatja** (a generalt fajl
      # == a tervbol szarmazo DDL) -> **a `git diff --exit-code` itt,
      # kulon lepesként**: a munkafa == a commit -> a fajlnek a
      # commitban kell lennie, kulonben a CI elbukik.
      - run: just ddl-diff
      - name: a generalt sema egyezik a commitottal
        run: git diff --exit-code db/ddl/schema-v1.1.sql

  # ==================================================================
  # 9–10. az image build es a frontend build (a 07 §8.1)
  # ==================================================================
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # **A Dockerfile-ok meg nem lteznek a repoban** (az `apps/api/`,
      # az `apps/web/`) -> a lepes a `just build` felteteles
      # viselkedeset koveti (a 07 §3.1)
      - name: a build (a Docker image-ek)
        run: |
          if [ -f apps/api/Dockerfile ]; then
            docker build -f apps/api/Dockerfile -t duna-api:ci .
          else
            echo "az API Dockerfile meg nincs a repoban -> a build kihagyva"
          fi
      - name: a PostgreSQL custom image build
        run: docker build -f infra/docker/postgres/Dockerfile -t duna-postgres:ci .
